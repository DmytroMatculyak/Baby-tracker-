<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#121212">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Трекер Малюка</title>
    <style>
        :root {
            --bg: #121212;
            --card: #1e1e24;
            --primary: #7c4dff;
            --secondary: #03dac6;
            --text: #ffffff;
            --text-muted: #a0a0ab;
            --danger: #cf6679;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 16px; padding-bottom: 80px; }
        header { text-align: center; margin-bottom: 20px; }
        h1 { font-size: 22px; font-weight: 600; }
        .subtitle { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
        
        /* Таймер */
        .timer-box {
            background: var(--card);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
            border: 1px solid #2c2c35;
        }
        .timer-label { font-size: 14px; color: var(--secondary); text-transform: uppercase; letter-spacing: 1px; }
        .timer-display { font-size: 48px; font-weight: 700; margin: 10px 0; font-variant-numeric: tabular-nums; }
        
        /* Сітка кнопок */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
        button {
            background: var(--card);
            color: var(--text);
            border: 1px solid #2e2e38;
            border-radius: 16px;
            padding: 18px 12px;
            font-size: 16px;
            font-weight: 600;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: 0.2s;
        }
        button:active { transform: scale(0.96); background: #2a2a35; }
        button.active { background: var(--primary); border-color: var(--primary); }
        .icon { font-size: 26px; }
        
        /* Швидке додавання пляшечки */
        .bottle-row { display: flex; gap: 8px; margin-bottom: 24px; }
        .bottle-btn { flex: 1; padding: 12px; font-size: 14px; flex-direction: row; justify-content: center; }

        /* Історія */
        .history-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .history-header h2 { font-size: 18px; }
        .clear-btn { background: none; border: none; color: var(--danger); font-size: 13px; padding: 4px; }
        .history-list { display: flex; flex-direction: column; gap: 10px; }
        .history-item {
            background: var(--card);
            padding: 14px 16px;
            border-radius: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .item-title { font-weight: 600; font-size: 15px; }
        .item-detail { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
        .item-time { font-size: 14px; color: var(--secondary); font-weight: 600; }
    </style>
</head>
<body>

    <header>
        <h1>👶 Трекер Малюка</h1>
        <div class="subtitle" id="last-info">Останній запис: немає</div>
    </header>

    <div class="timer-box">
        <div class="timer-label" id="active-task">Оберіть дію для старту</div>
        <div class="timer-display" id="timer">00:00</div>
        <button id="stop-btn" onclick="stopTimer()" style="display:none; width:100%; background:var(--danger); border:none; padding:14px;">⏹ Зупинити та зберегти</button>
    </div>

    <div class="grid">
        <button id="btn-left" onclick="startTimer('Ліва грудь', '🤱')">
            <span class="icon">🤱</span>
            <span>Ліва грудь</span>
        </button>
        <button id="btn-right" onclick="startTimer('Права грудь', '🤱')">
            <span class="icon">🤱</span>
            <span>Права грудь</span>
        </button>
        <button id="btn-sleep" onclick="startTimer('Сон', '😴')">
            <span class="icon">😴</span>
            <span>Сон</span>
        </button>
        <button onclick="addInstant('Підгузок', '🧷', 'Зміна підгузка')">
            <span class="icon">🧷</span>
            <span>Підгузок</span>
        </button>
    </div>

    <div class="bottle-row">
        <button class="bottle-btn" onclick="addBottle(60)">🍼 +60 мл</button>
        <button class="bottle-btn" onclick="addBottle(90)">🍼 +90 мл</button>
        <button class="bottle-btn" onclick="addBottle(120)">🍼 +120 мл</button>
    </div>

    <div class="history-header">
        <h2>Історія за сьогодні</h2>
        <button class="clear-btn" onclick="clearHistory()">Очистити</button>
    </div>
    <div class="history-list" id="history"></div>

    <script>
        let timerInterval = null;
        let seconds = 0;
        let currentTask = null;
        let currentIcon = '';

        // Завантаження історії з пам'яті телефону
        let records = JSON.parse(localStorage.getItem('babyRecords')) || [];
        renderHistory();

        function startTimer(taskName, icon) {
            if (timerInterval) {
                if (!confirm('Зупинити поточний таймер і почати новий?')) return;
                stopTimer();
            }
            currentTask = taskName;
            currentIcon = icon;
            seconds = 0;
            document.getElementById('active-task').innerText = icon + ' ' + taskName + '...';
            document.getElementById('stop-btn').style.display = 'flex';
            updateTimerDisplay();

            timerInterval = setInterval(() => {
                seconds++;
                updateTimerDisplay();
            }, 1000);
        }

        function stopTimer() {
            if (!timerInterval) return;
            clearInterval(timerInterval);
            timerInterval = null;

            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            const durationText = mins > 0 ? `${mins} хв ${secs} сек` : `${secs} сек`;

            saveRecord(currentTask, currentIcon, `Тривалість: ${durationText}`);
            
            document.getElementById('active-task').innerText = 'Оберіть дію для старту';
            document.getElementById('timer').innerText = '00:00';
            document.getElementById('stop-btn').style.display = 'none';
            currentTask = null;
        }

        function updateTimerDisplay() {
            const m = String(Math.floor(seconds / 60)).padStart(2, '0');
            const s = String(seconds % 60).padStart(2, '0');
            document.getElementById('timer').innerText = `${m}:${s}`;
        }

        function addBottle(ml) {
            saveRecord('Пляшечка', '🍼', `Об'єм: ${ml} мл`);
        }

        function addInstant(title, icon, detail) {
            saveRecord(title, icon, detail);
        }

        function saveRecord(title, icon, detail) {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('uk-UA', { hour: '2-digit', minute: '2-digit' });
            records.unshift({ title, icon, detail, time: timeStr });
            localStorage.setItem('babyRecords', JSON.stringify(records));
            renderHistory();
        }

        function renderHistory() {
            const list = document.getElementById('history');
            list.innerHTML = '';
            if (records.length > 0) {
                document.getElementById('last-info').innerText = `Останнє: ${records.title} о ${records.time}`;
            } else {
                document.getElementById('last-info').innerText = 'Останній запис: немає';
            }

            records.forEach(rec => {
                const div = document.createElement('div');
                div.className = 'history-item';
                div.innerHTML = `
                    <div>
                        <div class="item-title">${rec.icon} ${rec.title}</div>
                        <div class="item-detail">${rec.detail}</div>
                    </div>
                    <div class="item-time">${rec.time}</div>
                `;
                list.appendChild(div);
            });
        }

        function clearHistory() {
            if (confirm('Видалити всю історію?')) {
                records = [];
                localStorage.removeItem('babyRecords');
                renderHistory();
            }
        }
    </script>
</body>
</html>
