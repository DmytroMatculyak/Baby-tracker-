<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#121212">
<title>Трекер Малюка</title>
<style>
:root{--bg:#121212;--card:#1e1e24;--light:#272730;--prim:#7c4dff;--sec:#03dac6;--pink:#ff7597;--blue:#4dabf7;--txt:#fff;--mut:#a0a0a6;--red:#cf6679}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--txt);padding:14px;max-width:500px;margin:0 auto}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:14px;border:1px solid var(--light)}
.p-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.b-name{font-size:19px;font-weight:700}
.edit-btn{background:var(--light);border:none;color:var(--txt);padding:5px 10px;border-radius:8px;font-size:13px}
.age-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:rgba(0,0,0,.25);padding:8px;border-radius:10px;text-align:center;margin-bottom:8px}
.age-val{font-size:17px;font-weight:700;color:var(--prim)}
.age-lbl,.bio,.s-lbl,.stat-sub,.l-note,.l-time{font-size:12px;color:var(--mut)}
.bio{display:flex;justify-content:space-around}
.bio strong{color:var(--txt)}
.p-form{display:none;flex-direction:column;gap:8px}
.p-form input{background:var(--bg);border:1px solid var(--light);color:var(--txt);padding:9px;border-radius:8px;font-size:14px;width:100%}
.f-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.save-btn{background:var(--prim);color:#fff;border:none;padding:10px;border-radius:8px;font-weight:700}
.t-center{text-align:center}
.s-time{font-size:19px;font-weight:700;color:var(--sec);margin-top:4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.btn{background:var(--card);color:var(--txt);border:none;border-radius:14px;padding:14px 8px;font-size:15px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:6px}
.btn:active{transform:scale(.96);background:var(--light)}
.b-p{border-bottom:3px solid var(--pink)}.b-b{border-bottom:3px solid var(--blue)}.b-t{border-bottom:3px solid var(--sec)}.b-v{border-bottom:3px solid var(--prim)}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.stat-box{background:var(--light);padding:8px 4px;border-radius:10px;text-align:center}
.stat-num{font-size:17px;font-weight:700}
.h-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.clr-btn{background:none;border:none;color:var(--red);font-size:13px}
.l-item{background:var(--card);border-radius:12px;padding:12px;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.l-info,.l-right{display:flex;align-items:center;gap:10px}
.l-title{font-weight:600;font-size:14px}
.del-btn{background:none;border:none;color:var(--mut);font-size:16px;padding:4px}
</style>
</head>
<body>
<div class="card">
  <div class="p-head">
    <div class="b-name" id="dName">👶 Мій Малюк</div>
    <button class="edit-btn" onclick="togForm()">✏️ Дані</button>
  </div>
  <div id="pDisp">
    <div class="age-grid">
      <div><div class="age-val" id="aDays">0</div><div class="age-lbl">днів</div></div>
      <div><div class="age-val" id="aWeeks">0</div><div class="age-lbl">тижнів</div></div>
      <div><div class="age-val" id="aYears">0</div><div class="age-lbl" id="aYLbl">місяців</div></div>
    </div>
    <div class="bio">
      <span>Вага: <strong id="dW">—</strong></span>
      <span>Зріст: <strong id="dH">—</strong></span>
      <span>ДН: <strong id="dDob">не вказано</strong></span>
    </div>
  </div>
  <div class="p-form" id="pForm">
    <input type="text" id="iName" placeholder="Ім'я дитини">
    <input type="date" id="iDob">
    <div class="f-row">
      <input type="number" step="0.01" id="iW" placeholder="Вага (кг)">
      <input type="number" id="iH" placeholder="Зріст (см)">
    </div>
    <button class="save-btn" onclick="saveProf()">Зберегти дані</button>
  </div>
</div>

<div class="card t-center">
  <div class="s-lbl">З останнього годування минуло:</div>
  <div class="s-time" id="tFeed">Ще не було записів</div>
</div>
<div class="grid">
  <button class="btn b-p" onclick="addBf()"><span style="font-size:24px">🤱</span><span>Грудне</span></button>
  <button class="btn b-b" onclick="addBot()"><span style="font-size:24px">🍼</span><span>Пляшечка</span></button>
  <button class="btn b-t" onclick="addDia()"><span style="font-size:24px">🧷</span><span>Підгузок</span></button>
  <button class="btn b-v" onclick="addSlp()"><span style="font-size:24px">😴</span><span>Сон</span></button>
</div>

<div class="card">
  <div class="s-lbl" style="font-weight:600">📊 Статистика за сьогодні</div>
  <div class="stats-grid">
    <div class="stat-box"><div class="stat-num" style="color:var(--pink)" id="stF">0</div><div class="stat-sub" id="stMl">Годувань (0 мл)</div></div>
    <div class="stat-box"><div class="stat-num" style="color:var(--sec)" id="stD">0</div><div class="stat-sub" id="stDt">Підгузків (0💩)</div></div>
    <div class="stat-box"><div class="stat-num" style="color:var(--prim)" id="stS">0</div><div class="stat-sub">Засинань</div></div>
  </div>
</div>

<div class="h-head">
  <h3 style="font-size:16px">Історія подій</h3>
  <button class="clr-btn" onclick="clrAll()">Очистити все</button>
</div>
<div id="logList"></div>
<script>
let logs=JSON.parse(localStorage.getItem('bLogs'))||[];
let prof=JSON.parse(localStorage.getItem('bProf'))||{name:'Мій Малюк',dob:'',w:'',h:''};

function togForm(){
  const f=document.getElementById('pForm'),d=document.getElementById('pDisp');
  if(f.style.display==='flex'){f.style.display='none';d.style.display='block'}
  else{
    document.getElementById('iName').value=prof.name;
    document.getElementById('iDob').value=prof.dob;
    document.getElementById('iW').value=prof.w;
    document.getElementById('iH').value=prof.h;
    f.style.display='flex';d.style.display='none';
  }
}

function saveProf(){
  prof={
    name:document.getElementById('iName').value.trim()||'Мій Малюк',
    dob:document.getElementById('iDob').value,
    w:document.getElementById('iW').value,
    h:document.getElementById('iH').value
  };
  localStorage.setItem('bProf',JSON.stringify(prof));
  togForm();renderProf();
}

function renderProf(){
  document.getElementById('dName').textContent='👶 '+prof.name;
  document.getElementById('dW').textContent=prof.w?prof.w+' кг':'—';
  document.getElementById('dH').textContent=prof.h?prof.h+' см':'—';
  if(!prof.dob){document.getElementById('dDob').textContent='натисніть ✏️ Дані';return}
  const dob=new Date(prof.dob),now=new Date();
  document.getElementById('dDob').textContent=dob.toLocaleDateString('uk-UA');
  const days=Math.max(0,Math.floor((now-dob)/864e5));
  document.getElementById('aDays').textContent=days;
  document.getElementById('aWeeks').textContent=Math.floor(days/7);
  let y=now.getFullYear()-dob.getFullYear(),m=now.getMonth()-dob.getMonth();
  if(now.getDate()<dob.getDate())m--;
  if(m<0){y--;m+=12}
  if(y>=1){
    document.getElementById('aYears').textContent=y;
    document.getElementById('aYLbl').textContent=y===1?'рік':(y<5?'роки':'років');
  }else{
    document.getElementById('aYears').textContent=m;
    document.getElementById('aYLbl').textContent=m===1?'місяць':(m>=2&&m<=4?'місяці':'місяців');
  }
}

function save(){localStorage.setItem('bLogs',JSON.stringify(logs));render();updTimer();updStats()}
function add(t,ic,ti,n='',ex={}){logs.unshift({id:Date.now(),t,ic,ti,n,ex,ts:Date.now()});save()}
function addBf(){
  const s=prompt("Яка грудь? (Л - ліва, П - права)");
  let n='';
  if(s){const l=s.trim().toLowerCase();n=l.startsWith('л')?'Ліва грудь':(l.startsWith('п')?'Права грудь':s)}
  add('feed','🤱','Грудне годування',n);
}
function addBot(){const ml=parseInt(prompt("Скільки мл?"))||0;add('feed','🍼','Пляшечка',ml>0?ml+' мл':'',{ml})}
function addDia(){const d=confirm("ОК - брудний (покакав), Скасувати - тільки мокрий");add('dia','🧷','Підгузок',d?'Мокрий + брудний':'Тільки мокрий',{d})}
function addSlp(){const w=confirm("Малюк ПРОКИНУВСЯ (ОК) чи ЗАСНУВ (Скасувати)?");add('slp',w?'☀️':'😴',w?'Прокинувся':'Заснув','',{w})}
function del(id){logs=logs.filter(i=>i.id!==id);save()}
function clrAll(){if(confirm("Видалити всю історію?")){logs=[];save()}}

function updStats(){
  const today=new Date().setHours(0,0,0,0),tl=logs.filter(i=>i.ts>=today);
  let f=0,ml=0,d=0,dt=0,s=0;
  tl.forEach(i=>{
    if(i.t==='feed'){f++;if(i.ex.ml)ml+=i.ex.ml}
    else if(i.t==='dia'){d++;if(i.ex.d)dt++}
    else if(i.t==='slp'&&!i.ex.w)s++;
  });
  document.getElementById('stF').textContent=f;
  document.getElementById('stMl').textContent=`Годувань (${ml} мл)`;
  document.getElementById('stD').textContent=d;
  document.getElementById('stDt').textContent=`Підгузків (${dt}💩)`;
  document.getElementById('stS').textContent=s;
}

function updTimer(){
  const el=document.getElementById('tFeed'),lf=logs.find(i=>i.t==='feed');
  if(!lf){el.textContent='Ще не було записів';return}
  const m=Math.floor((Date.now()-lf.ts)/6e4),h=Math.floor(m/60);
  el.textContent=h>0?`${h} год ${m%60} хв тому`:`${m} хв тому`;
}

function render(){
  const el=document.getElementById('logList');
  if(!logs.length){el.innerHTML='<div class="t-center s-lbl" style="padding:20px">Записів поки немає</div>';return}
  el.innerHTML=logs.map(i=>{
    const dt=new Date(i.ts),tm=dt.toLocaleTimeString('uk-UA',{hour:'2-digit',minute:'2-digit'});
    const isT=dt.toDateString()===new Date().toDateString();
    const str=isT?tm:dt.toLocaleDateString('uk-UA',{day:'2-digit',month:'2-digit'})+' '+tm;
    return `<div class="l-item"><div class="l-info"><span style="font-size:20px">${i.ic}</span><div><div class="l-title">${i.ti}</div>${i.n?`<div class="l-note">${i.n}</div>`:''}</div></div><div class="l-right"><span class="l-time">${str}</span><button class="del-btn" onclick="del(${i.id})">✕</button></div></div>`;
  }).join('');
}

setInterval(updTimer,6e4);renderProf();save();
</script>
</body>
</html>
